name: verify

# 资源/agent 校验门禁：push 与 PR 均强制执行 scripts/verify_feature.py，
# 并检查 docs/任务流程与UI重测清单.md 是否与 pipeline 同步（由 gen_flow_doc.py 再生比对）。
# 校验失败（死链 / 跨文件同名节点 / 扫荡链缺 timeout / ROI 越界 / override 断链 / 文档过期）
# 时本 workflow 标红，阻止问题进入 master。
on:
  push:
    branches: [master]
    paths:
      - "resource/**"
      - "agent/**"
      - "interface.json"
      - "scripts/verify_feature.py"
      - "scripts/gen_flow_doc.py"
      - "docs/任务流程与UI重测清单.md"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "resource/**"
      - "agent/**"
      - "interface.json"
      - "scripts/verify_feature.py"
      - "scripts/gen_flow_doc.py"
      - "docs/任务流程与UI重测清单.md"
      - ".github/workflows/verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯标准库脚本，无需安装依赖；py_compile 只查语法不执行 import，ubuntu 可跑。
      - name: Run verify_feature.py
        run: python scripts/verify_feature.py

      # 文档同步检查：重新生成流程清单并与仓库版本比对，不一致即 FAIL，
      # 提示在本地重跑 python scripts/gen_flow_doc.py 并提交。
      - name: Check flow doc is up to date
        run: |
          python scripts/gen_flow_doc.py
          if ! git diff --exit-code -- "docs/任务流程与UI重测清单.md"; then
            echo "::error::docs/任务流程与UI重测清单.md 与 pipeline 不同步，请在本地运行 python scripts/gen_flow_doc.py 后提交更新后的文档。"
            exit 1
          fi

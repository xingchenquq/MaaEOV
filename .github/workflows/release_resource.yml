name: release_resource

# ⚠️ 发布策略（2026-09 起）：目前只发【完整包】，不做增量（resource）更新。
#   完整包含 MFA / agent / python 等二进制，且这些都在 .gitignore、CI 拿不到，
#   因此完整包只能【本机构建】后用 curl 直连 GitHub uploads API 手动上传到 Release
#   （见 skill: maaeov-release、docs/Agent启动失败排查.md）。
#
#   为避免本工作流在 push tag 时自动建 Release 并挂 MaaEOV-resource.zip（增量包），
#   与「仅完整包」策略冲突、并干扰手动发布的完整包，**已移除 push tag 自动触发**。
#   仅在需要临时产出旧版增量包时，到仓库 Actions 页面手动 Run workflow 触发。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v1.14.4"
        required: true
        default: "v1.14.4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠️ 2026-11-24 修复：此前调用 pack_resource.py（不含 agent/ 的旧增量包形态）——
      #    MFA「检查更新」为全量更新，会先删用户 resource/ 与 agent/ 再按包复制，
      #    缺 agent/ 会把用户 agent/ 删空、程序失效（见 build_resource_zip.py 头部约束）。
      #    现改用 build_resource_zip.py：interface.json + resource/ + 完整 agent/ + pipeline 清单，
      #    包名带 win-x64（GetAssetPriority 100），构建后自带程序文件泄漏阻断。
      - name: Build resource package (must include agent/)
        run: |
          # 包内 version 取自 interface.json，必须与 release tag 一致
          iface_ver=$(python3 -c "import json;print(json.load(open('interface.json',encoding='utf-8'))['version'])")
          if [ "v$iface_ver" != "${{ steps.tag.outputs.tag }}" ] && [ "$iface_ver" != "${{ steps.tag.outputs.tag#v }}" ]; then
            echo "::error::interface.json version ($iface_ver) 与 tag (${{ steps.tag.outputs.tag }}) 不一致，请先对齐再触发打包"
            exit 1
          fi
          python3 scripts/build_resource_zip.py

      # ⚠️ 该步骤会把资源包作为 asset 挂到该 tag 的 Release 上。
      #    当前「仅完整包」策略下请勿自动运行本工作流。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MaaEOV ${{ steps.tag.outputs.tag }}
          # Release 正文会作为 MFAAvalonia 的更新日志/公告展示，可发布后在网页上再编辑
          generate_release_notes: true
          files: |
            dist/MaaEOV-*-resource-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
